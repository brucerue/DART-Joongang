name: 알람 신청·명령 확인

# 30분마다 봇에게 온 메시지를 읽어서 처리해요 (뉴스는 보내지 않아요).
#  1) 앱 '알람 받기' 신청 -> 관리자(ADMIN_CHAT_ID)에게 알림 + 신청자에게 접수 안내
#  2) 받는 사람의 명령 /섹터 /종류 /끄기 /켜기 /설정 -> 설정을 바꾸고 바로 답장
# 설정은 digest_prefs.json 캐시에 저장돼 뉴스 발송(news_digest.yml)이 읽어 가요.
# GitHub 예약은 UTC 기준이고 실제로는 몇 분 늦게 시작할 수 있어요.
# 한국 06:00~23:30, 매일(주말 포함). 캐시를 계속 살려 두려는 목적도 있어요(7일 안 쓰면 GitHub가 지워요).
on:
  schedule:
    - cron: "*/30 21-23,0-14 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: news-commands
  cancel-in-progress: false

jobs:
  commands:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - uses: actions/cache@v4
        with:
          path: digest_prefs.json
          key: digest-prefs-${{ github.run_id }}
          restore-keys: digest-prefs-
      - name: 신청·명령 확인
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DIGEST_SUBSCRIBERS: ${{ secrets.DIGEST_SUBSCRIBERS }}
          ADMIN_CHAT_ID: ${{ secrets.ADMIN_CHAT_ID }}
        run: python news_digest.py --commands-only
