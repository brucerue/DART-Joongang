name: 산업 뉴스 텔레그램 발송

on:
  schedule:
    # GitHub 예약은 UTC 기준(한국시간 - 9시간). 실제 실행은 보통 20~25분 늦게 시작함(실측: 53분 예약 -> 17~19분 도착).
    # 예약 시각(한국): 월~금 06:30(첫 회차) / 07:45, 08:45, ... 17:45 / 18:30(마지막 회차). 토·일은 보내지 않음.
    # 한국 06:30~08:45는 UTC로는 전날 21~23시라서 요일(0=일 ~ 6=토)이 하루 앞서요: 한국 월~금 = UTC 일~목(0-4). 그 이후 시각은 UTC도 월~금(1-5).
    - cron: "30 21 * * 0-4"                        # 한국 월~금 06:30
    - cron: "45 22,23 * * 0-4"                     # 한국 월~금 07:45, 08:45
    - cron: "45 0,1,2,3,4,5,6,7,8 * * 1-5"         # 한국 월~금 09:45 ~ 17:45
    - cron: "30 9 * * 1-5"                         # 한국 월~금 18:30
  workflow_dispatch: # Actions 탭의 'Run workflow' 버튼으로 원할 때 바로 실행 (아래 항목을 골라 시험 발송 가능)
    inputs:
      only:
        description: "이 사람에게만 보내기 (받는 사람 이름 또는 chat id, 비우면 전체)"
        required: false
        default: ""
      mode:
        description: "조회 방식"
        type: choice
        options: ["전체", "통신", "단독", "공시"]
        default: "전체"
      sectors:
        description: "섹터 (쉼표로, 예: 자동차,배터리 / 비우면 각자 설정대로)"
        required: false
        default: ""
      force:
        description: "이미 보낸 기사도 다시 보내기 (보낸 기록은 남기지 않음)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: news-digest
  cancel-in-progress: false

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      # 이미 보낸 기사 기록을 회차 사이에 이어 쓰기 위한 저장소
      - uses: actions/cache@v4
        with:
          path: digest_seen.json
          key: digest-seen-${{ github.run_id }}
          restore-keys: digest-seen-
      # 받는 사람이 봇 명령(/섹터 등)으로 바꾼 설정 (30분마다 도는 '알람 명령 확인'과 함께 쓰는 저장소)
      - uses: actions/cache@v4
        with:
          path: digest_prefs.json
          key: digest-prefs-${{ github.run_id }}
          restore-keys: digest-prefs-
      - name: 뉴스 조회 후 텔레그램 발송
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DIGEST_SUBSCRIBERS: ${{ secrets.DIGEST_SUBSCRIBERS }}
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
          ADMIN_CHAT_ID: ${{ secrets.ADMIN_CHAT_ID }}
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
          IN_ONLY: ${{ inputs.only }}
          IN_MODE: ${{ inputs.mode }}
          IN_SECTORS: ${{ inputs.sectors }}
          IN_FORCE: ${{ inputs.force }}
        run: |
          args=()
          [ -n "$IN_ONLY" ] && args+=(--only "$IN_ONLY")
          [ -n "$IN_MODE" ] && [ "$IN_MODE" != "전체" ] && args+=(--mode "$IN_MODE")
          [ -n "$IN_SECTORS" ] && args+=(--sectors "$IN_SECTORS")
          [ "$IN_FORCE" = "true" ] && args+=(--force)
          python news_digest.py "${args[@]}"
