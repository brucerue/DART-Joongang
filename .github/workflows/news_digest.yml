name: 산업 뉴스 텔레그램 발송

on:
  # 정시 실행은 Cloudflare Worker가 맡아요(apps_script/worker.js: 한국 평일 8~19시 매시 정각에 이 워크플로를 호출).
  # GitHub 자체 예약(schedule)은 20~30분씩 밀려서 쓰지 않아요.
  workflow_dispatch: # Actions 탭의 'Run workflow' 버튼으로 원할 때 바로 실행 (아래 항목을 골라 시험 발송 가능)
    inputs:
      only:
        description: "이 사람에게만 보내기 (받는 사람 이름 또는 chat id, 비우면 전체)"
        required: false
        default: ""
      mode:
        description: "조회 방식"
        type: choice
        options: ["전체", "통신", "단독", "공시"]
        default: "전체"
      sectors:
        description: "섹터 (쉼표로, 예: 자동차,배터리 / 비우면 각자 설정대로)"
        required: false
        default: ""
      force:
        description: "이미 보낸 기사도 다시 보내기 (보낸 기록은 남기지 않음)"
        type: boolean
        default: false
      auto:
        description: "정시 자동 실행용(Worker가 켬): 받는 사람이 정한 받는 시간 밖이면 건너뜀. 수동 시험에서는 끄세요"
        type: boolean
        default: false

permissions:
  contents: write  # 정시 회차에 모은 기사를 'data' 브랜치에 올리기 위해 필요

concurrency:
  group: news-digest
  cancel-in-progress: false

jobs:
  digest:
    runs-on: ubuntu-24.04  # Ubuntu 26 자동 전환을 피하려고 고정 (2026.10)
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install requests
      # 이미 보낸 기사 기록을 회차 사이에 이어 쓰기 위한 저장소
      - uses: actions/cache@v5
        with:
          path: digest_seen.json
          key: digest-seen-${{ github.run_id }}
          restore-keys: digest-seen-
      # 받는 사람이 봇 명령(/섹터 등)으로 바꾼 설정 (30분마다 도는 '알람 명령 확인'과 함께 쓰는 저장소)
      - uses: actions/cache@v5
        with:
          path: digest_prefs.json
          key: digest-prefs-${{ github.run_id }}
          restore-keys: digest-prefs-
      # 정시 회차(Worker가 auto로 부름): 먼저 모든 섹터 기사를 모아 'data' 브랜치(앱 산업 뉴스·오늘의 현황이 읽음)에 저장하고,
      # 같은 결과(fresh.json)로 아래에서 알람을 보낸다 — 같은 검색을 두 번 하지 않음. 정각은 통신·단독·일반·공시, 15·30·45분은 단독만.
      # 이 단계가 실패해도 발송은 예전처럼 직접 검색해서 보낸다(continue-on-error).
      - name: 기사 모아두기 (앱용 저장 + 이번 발송에 사용)
        if: inputs.auto
        continue-on-error: true
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
          IN_MODE: ${{ inputs.mode }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}  # 외신 한글 제목 (없으면 번역 없이 모으고 앱이 볼 때 옮김)
        run: |
          mkdir -p data
          git fetch origin data --depth=1 || true
          git --work-tree=data checkout origin/data -- . 2>/dev/null || true
          if [ "$IN_MODE" = "단독" ]; then
            python collect_data.py --out data --modes 단독 --no-disc --dump fresh.json
          else
            python collect_data.py --out data --dump fresh.json
          fi
          cd data
          git init -q -b data
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "data $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" data
      - name: 뉴스 조회 후 텔레그램 발송
        env:
          COLLECTED_FILE: fresh.json  # 위에서 모아 둔 기사 (없거나 빠진 섹터는 직접 검색)
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DIGEST_SUBSCRIBERS: ${{ secrets.DIGEST_SUBSCRIBERS }}
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
          ADMIN_CHAT_ID: ${{ secrets.ADMIN_CHAT_ID }}
          PREFS_URL: ${{ secrets.PREFS_URL }}  # (선택) 구글 Apps Script 즉시 응답 방식을 쓸 때만
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
          IN_ONLY: ${{ inputs.only }}
          IN_MODE: ${{ inputs.mode }}
          IN_SECTORS: ${{ inputs.sectors }}
          IN_FORCE: ${{ inputs.force }}
          IN_AUTO: ${{ inputs.auto }}
        run: |
          args=()
          [ -n "$IN_ONLY" ] && args+=(--only "$IN_ONLY")
          [ -n "$IN_MODE" ] && [ "$IN_MODE" != "전체" ] && args+=(--mode "$IN_MODE")
          [ -n "$IN_SECTORS" ] && args+=(--sectors "$IN_SECTORS")
          [ "$IN_FORCE" = "true" ] && args+=(--force)
          [ "$IN_AUTO" = "true" ] && args+=(--auto)
          python news_digest.py "${args[@]}"
      # 위 단계가 실패하면 관리자(나)에게 텔레그램으로 알림 (같은 종류는 1시간에 한 번만)
      - name: 실패 알림
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          ADMIN_CHAT_ID: ${{ secrets.ADMIN_CHAT_ID }}
          PREFS_URL: ${{ secrets.PREFS_URL }}
          IN_MODE: ${{ inputs.mode }}
        run: python news_digest.py --alert digest
