name: 시세 모으기

# 평일 아침에 KRX 일별 시세(섹터 기업 + 재계 상위 그룹 상장 계열사)를 'prices' 브랜치에 쌓습니다(약 1년 보관).
# 앱의 '주가' 탭(라이벌 비교·주가 이벤트·그룹 시총)이 이 파일을 읽습니다.
# 처음에는 수동 실행(Run workflow)을 여러 번 눌러 과거 시세를 채우세요 (한 번에 max_days일씩).
on:
  schedule:
    - cron: "40 0 * * 1-5" # 한국 시간 평일 09시 40분
  workflow_dispatch:
    inputs:
      since:
        description: "처음 채울 때 시작할 날짜 (YYYYMMDD). 이미 자료가 있으면 무시"
        default: "20251001"
      max_days:
        description: "한 번에 확인할 평일 수 (하루당 KRX 호출 2번)"
        default: "60"
      reset:
        description: "true면 지금까지 쌓은 것을 버리고 처음부터 다시 채움"
        default: "false"

permissions:
  contents: write # prices 브랜치에 올리기 위해 필요

concurrency:
  group: price-history
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-24.04  # Ubuntu 26 자동 전환을 피하려고 고정 (2026.10)
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: 지금까지 쌓은 시세 가져오기
        run: |
          git fetch origin prices --depth=1 || true
          git show origin/prices:prices.json > prev.json 2>/dev/null || rm -f prev.json
          git fetch origin corp-codes --depth=1 || true
          git show origin/corp-codes:corp_codes.csv > corp_codes.csv 2>/dev/null || rm -f corp_codes.csv
      - name: 새 거래일 시세 더하기
        run: |
          args=(--prev prev.json --corp corp_codes.csv --out prices.json --since "${IN_SINCE:-20251001}" --max-days "${IN_MAX_DAYS:-60}")
          [ "$IN_RESET" = "true" ] && args+=(--reset)
          python price_history.py "${args[@]}"
        env:
          KRX_API_KEY: ${{ secrets.KRX_API_KEY }}
          IN_SINCE: ${{ inputs.since }}
          IN_MAX_DAYS: ${{ inputs.max_days }}
          IN_RESET: ${{ inputs.reset }}
      - name: prices 브랜치에 올리기 (기록을 남기지 않고 한 커밋으로 덮어씀)
        run: |
          mkdir -p out && cp prices.json out/
          cd out
          git init -q -b prices
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add prices.json
          git commit -q -m "prices $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" prices
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: 실패 알림
        if: failure()
        run: python news_digest.py --alert prices
        env:
          PREFS_URL: ${{ secrets.PREFS_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          ADMIN_CHAT_ID: ${{ secrets.ADMIN_CHAT_ID }}
