name: 관세청 순번 이름 맞추기 시험 (임시)

# 10일 단위 잠정치의 1~10번째 항목이 어떤 국가·품목인지 월별 정식 API의 금액과 맞춰 보는 임시 수동 작업입니다. 확인이 끝나면 지웁니다.
on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: 시험
        env:
          KEY: ${{ secrets.CUSTOMS_API_KEY }}
        run: |
          python - <<'PY' 2>&1 | sed "s/$(printf '%s' "$KEY" | sed 's/[][\.*^$/]/\\&/g')/***KEY***/g" | tee out.txt
          import os, urllib.parse, requests, time
          import xml.etree.ElementTree as ET
          key = os.environ["KEY"].strip()
          if "%" in key: key = urllib.parse.unquote(key)
          B = "https://apis.data.go.kr/1220000/"
          def items(path, **p):
              r = requests.get(B + path, params={"serviceKey": key, **p}, timeout=90)
              try: root = ET.fromstring(r.text)
              except ET.ParseError: return []
              return [{c.tag: (c.text or "").strip() for c in it} for it in root.findall(".//item")]
          num = lambda s: int(str(s).replace(",", "") or 0)
          for ym in ("202609", "202509"):
              print(f"\n===== {ym} =====")
              for kind, path, label in (("수출 국가", "cntyMmUtPrviExpAcrs/getCntyMmUtPrviExpAcrs", "exp"), ("수입 국가", "cntyMmUtPrviImpAcrs/getCntyMmUtPrviImpAcrs", "imp")):
                  rows = items(path, strtYymm=ym, endYymm=ym)
                  full = [r for r in rows if r["priodDt"] in ("01~30", "01~31")][-1]
                  nat = items("nationtrade/getNationtradeList", strtYymm=ym, endYymm=ym)
                  col = "expDlr" if label == "exp" else "impDlr"
                  out = []
                  for i in range(1, 11):
                      v = num(full[f"itemUsdAmt{i:02d}"])
                      hit = [n["statCdCntnKor1"] for n in nat if abs(round(num(n[col]) / 1000) - v) <= 1]
                      out.append(f"{i:02d}:{','.join(hit) or '?'}")
                  print(kind, " ".join(out))
              for kind, path, label in (("수출 품목", "prlstMmUtPrviExpAcrs/getPrlstMmUtPrviExpAcrs", "exp"), ("수입 품목", "prlstMmUtPrviImpAcrs/getPrlstMmUtPrviImpAcrs", "imp")):
                  rows = items(path, strtYymm=ym, endYymm=ym)
                  full = [r for r in rows if r["priodDt"] in ("01~30", "01~31")][-1]
                  vals = [num(full[f"itemUsdAmt{i:02d}"]) for i in range(1, 11)]
                  print(kind, "값(천달러):", vals)
                  col = "expDlr" if label == "exp" else "impDlr"
                  found = {}
                  cands = ["27","29","38","39","40","72","73","74","76","84","85","87","89","90","30","33","31","28","26","25","8542","8541","8517","8703","8708","8901","8905","2710","7208","7210","8523","8486","9013","8528","8471","3901","3902","2902","2903","3907","7225","8504","8507","8481","8483","9018","8802","8716","7601","7408","8714","8711","8703","8704"]
                  for hs in dict.fromkeys(cands):
                      tot = [r for r in items("nitemtrade/getNitemtradeList", strtYymm=ym, endYymm=ym, hsSgn=hs) if r.get("year") == "총계"]
                      if not tot: continue
                      amt = round(num(tot[0][col]) / 1000)
                      for i, v in enumerate(vals, 1):
                          if abs(amt - v) <= 1: found.setdefault(i, []).append(hs)
                  print(kind, "HS 일치:", found)
          PY
      - name: 결과를 주석으로 남기기
        if: always()
        run: |
          split -b 2800 -d out.txt part_
          n=0
          for f in part_*; do
            n=$((n+1))
            msg=$(sed ':a;N;$!ba;s/%/%25/g;s/\r/%0D/g;s/\n/%0A/g' "$f")
            echo "::notice title=관세청순번시험 $n::${msg}"
          done
