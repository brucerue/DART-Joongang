name: 임시 - 공시 요약 점검
on: workflow_dispatch
jobs:
  t:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: {python-version: "3.12"}
      - run: pip install requests
      - env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: fake
        run: |
          python - <<'PY'
          import news_digest as nd
          from datetime import datetime
          now = datetime.now(nd.KST)
          feed = nd.fetch_dart_feed(now)
          items = []
          for s in nd.SECTORS:
              items += [i for i in nd.disclosure_items(feed, s) if not i.get("earn")]
          items = list({i["key"]: i for i in items}.values())[:12]
          seen = {}
          nd.summarize_disclosures(items, seen, now)
          ok = sum(1 for i in items if i.get("detail"))
          print(f"::notice::요약 {ok}/{len(items)}")
          for i in items:
              print(f"::notice::{i['title'][:50]} => {(i.get('detail') or '(없음)').strip()[:150]}")
          for k, v in seen.items():
              if v.endswith("|"): print(f"::notice::버림 {k}")
          PY
