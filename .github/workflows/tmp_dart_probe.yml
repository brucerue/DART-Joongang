name: tmp dart probe
on: workflow_dispatch
jobs:
  t:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install requests
      - name: probe
        run: |
          python - <<'PY'
          import requests, re
          for rcp in ("20221114000599", "20260317002345"):
              r = requests.get("https://dart.fss.or.kr/dsaf001/main.do", params={"rcpNo": rcp}, headers={"User-Agent": "Mozilla/5.0"}, timeout=30)
              t = r.text
              print(f"::notice::{rcp} status={r.status_code} len={len(t)}")
              m = re.findall(r"node\d+\['text'\]\s*=\s*\"([^\"]*)\";", t)
              print(f"::notice::{rcp} texts={m[:40]}")
              i = t.find("연결재무제표")
              print(f"::notice::{rcp} ctx={t[max(0,i-400):i+500]!r}"[:1500])
          PY
