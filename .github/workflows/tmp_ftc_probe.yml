name: tmp ftc probe
on: workflow_dispatch
jobs:
  t:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install requests openpyxl xlrd
      - name: p
        run: |
          cat > p.py <<'PYEOF'
          import requests, re, io, zipfile, sys, traceback
          H={"User-Agent":"Mozilla/5.0"}
          IDS=["41119","41476","41915","42416","42836","43406","46053"]
          def fname(n):
              try: return n.encode("cp437").decode("euc-kr")
              except Exception:
                  try: return n.encode("cp437").decode("utf-8")
                  except Exception: return n
          def lst(z, depth=0):
              out=[]
              for i in z.infolist():
                  nm=fname(i.filename)
                  out.append(("  "*depth)+nm+f"({i.file_size//1000}k)")
                  if nm.lower().endswith(".zip") and depth<2:
                      try: out+=lst(zipfile.ZipFile(io.BytesIO(z.read(i))),depth+1)
                      except Exception: out.append("  "*(depth+1)+"(열기 실패)")
              return out
          step=sys.argv[1]
          for n in (IDS[:4] if step=="a" else IDS[4:]):
              try:
                  r=requests.get("https://www.ftc.go.kr/www/downloadBbsFileAll.do",params={"atchmnflNo":n},headers=H,timeout=120)
                  z=zipfile.ZipFile(io.BytesIO(r.content))
                  items=[x for x in lst(z) if not re.search(r"\.(hwpx|pdf)\(",x)]
                  print("::notice::"+n+": "+" | ".join(items)[:2300])
              except Exception:
                  print("::notice::ERR "+n+" "+traceback.format_exc()[-300:].replace(chr(10)," | "))
          
          PYEOF
          python p.py a
      - name: q
        run: python p.py b
