name: tmp ftc probe
on: workflow_dispatch
jobs:
  t:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install requests openpyxl xlrd
      - name: p
        run: |
          cat > p.py <<'PYEOF'
          import requests, re, io, zipfile, sys, traceback, openpyxl
          H={"User-Agent":"Mozilla/5.0"}
          IDS=["41915","43406"]
          def fname(n):
              try: return n.encode("cp437").decode("euc-kr")
              except Exception:
                  try: return n.encode("cp437").decode("utf-8")
                  except Exception: return n
          def walk(z):
              for i in z.infolist():
                  nm=fname(i.filename)
                  if nm.lower().endswith(".zip"):
                      yield from walk(zipfile.ZipFile(io.BytesIO(z.read(i))))
                  elif nm.lower().endswith(".xlsx"):
                      yield nm, z.read(i)
          def peek(nm,data,rows=6):
              wb=openpyxl.load_workbook(io.BytesIO(data),read_only=True,data_only=True)
              out=f"[{nm[-28:]}] sheets={wb.sheetnames[:5]} "
              ws=wb[wb.sheetnames[0]]
              rr=[]
              for k,row in enumerate(ws.iter_rows(values_only=True)):
                  if k>=rows: break
                  rr.append([str(c).replace(chr(10),' ')[:12] for c in row[:11] if c is not None])
              return out+str(rr)[:520]
          step=sys.argv[1]
          for n in (IDS if step=="a" else []):
              try:
                  r=requests.get("https://www.ftc.go.kr/www/downloadBbsFileAll.do",params={"atchmnflNo":n},headers=H,timeout=120)
                  z=zipfile.ZipFile(io.BytesIO(r.content))
                  msgs=[]
                  for nm,data in walk(z):
                      if re.search(r"(지정 현황|별첨1\.xlsx|별첨 1\.|1\. 공시대상기업집단 계열회사 수|변동)",nm):
                          msgs.append(peek(nm,data))
                  print("::notice::"+n+": "+" ## ".join(msgs)[:2400])
              except Exception:
                  print("::notice::ERR "+n+" "+traceback.format_exc()[-300:].replace(chr(10)," | "))
          
          PYEOF
          python p.py a
      - name: q
        run: python p.py b
