name: tmp ftc probe
on: workflow_dispatch
jobs:
  t:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install requests
      - name: probe
        run: |
          cat > p.py <<'PYEOF'
          import requests, re, html, traceback
          H={"User-Agent":"Mozilla/5.0"}
          def lst(kw, pages=3):
              out={}
              for pg in range(1,pages+1):
                  r=requests.get("https://www.ftc.go.kr/www/selectBbsNttList.do",params={"key":"12","bordCd":"3","pageIndex":str(pg),"searchCnd":"all","searchKrwd":kw},headers=H,timeout=40)
                  for h,tx in re.findall(r'<a href="(\./selectBbsNttView\.do[^"]*)"[^>]*>(.*?)</a>',r.text,re.S):
                      n=re.search(r"nttSn=(\d+)",h).group(1); out[n]=html.unescape(re.sub(r"<[^>]+>","",tx)).strip()
              return out
          def main():
              allf={}
              for kw in ("대기업집단 지정","상호출자제한기업집단 지정","기업집단 지정 현황","기업집단 지정결과"):
                  allf.update(lst(kw))
              sel={n:t for n,t in allf.items() if re.search(r"지정",t) and not re.search(r"제외|설명|제재|행정예고|개정|해명|연기|동일인|고시",t)}
              msg=" ;; ".join(f"{n}:{t[:34]}" for n,t in sorted(sel.items()))
              print("::notice::후보 "+msg[:3000])
              for n in ("43406","42836","41476"):
                  v=requests.get("https://www.ftc.go.kr/www/selectBbsNttView.do",params={"key":"12","bordCd":"3","nttSn":n},headers=H,timeout=40).text
                  files=re.findall(r'href="([^"]*(?:downloadBbsFile|previewBbsAtchmnfl)[^"]*)"',v)
                  names=re.findall(r'<span[^>]*class="[^"]*file[^"]*"[^>]*>(.*?)</span>|<a[^>]*download[^>]*>(.*?)</a>',v,re.S)
                  print(f"::notice::{n} links={files[:8]}")
                  i=v.find("첨부")
                  print(f"::notice::{n} ctx={re.sub(chr(10)+'|'+chr(13)+'|'+chr(9),' ',v[i:i+1200])[:900]}")
          try:
              main()
          except Exception:
              print("::notice::ERR "+traceback.format_exc()[-700:].replace(chr(10)," | "))
          
          PYEOF
          python p.py
