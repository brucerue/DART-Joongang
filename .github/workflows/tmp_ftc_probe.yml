name: tmp ftc probe
on: workflow_dispatch
jobs:
  t:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install requests
      - name: probe
        run: |
          python - <<'PY'
          import requests, re, html
          H={"User-Agent":"Mozilla/5.0"}
          found={}
          for kw in ("공시대상기업집단 지정","대규모기업집단 지정","기업집단 지정 결과"):
              for pg in range(1,6):
                  r=requests.get("https://www.ftc.go.kr/www/selectBbsNttList.do",params={"key":"12","bordCd":"3","pageIndex":str(pg),"searchCnd":"all","searchKrwd":kw},headers=H,timeout=40)
                  for h,tx in re.findall(r'<a href="(\./selectBbsNttView\.do[^"]*)"[^>]*>(.*?)</a>',r.text,re.S):
                      n=re.search(r"nttSn=(\d+)",h).group(1); t=html.unescape(re.sub(r"<[^>]+>","",tx)).strip()
                      found[n]=t
          sel={n:t for n,t in found.items() if re.search(r"(지정|발표)",t) and re.search(r"(공시대상|대규모)기업집단|기업집단 지정",t) and ("제외" not in t) and ("설명" not in t) and ("제재" not in t)}
          for n,t in sorted(sel.items()):
              print(f"::notice::{n} | {t[:90]}")
          for n in sorted(sel)[:12]:
              v=requests.get("https://www.ftc.go.kr/www/selectBbsNttView.do",params={"key":"12","bordCd":"3","nttSn":n},headers=H,timeout=40).text
              d=re.search(r"(20\d\d)[-.]\s?(\d\d)[-.]\s?(\d\d)",v)
              files=re.findall(r'<a[^>]*href="([^"]*downloadBbsFile\.do[^"]*)"[^>]*>(.*?)</a>',v,re.S)
              print(f"::notice::{n} files={len(files)} "+" || ".join(html.unescape(re.sub(r'<[^>]+>','',tx)).strip()[:40] for h,tx in files)[:600])
          PY
