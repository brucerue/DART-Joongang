name: tmp ftc probe
on: workflow_dispatch
jobs:
  t:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install requests
      - name: probe
        run: |
          python - <<'PY'
          import requests, re
          H={"User-Agent":"Mozilla/5.0"}
          for url,params in (("https://www.ftc.go.kr/www/selectBbsNttList.do",{"key":"12","bordCd":"3","searchCtgry":"","pageIndex":"1","searchCnd":"all","searchKrwd":"공시대상기업집단 지정"}),):
              try:
                  r=requests.get(url,params=params,headers=H,timeout=40)
                  t=r.text
                  print(f"::notice::status={r.status_code} len={len(t)}")
                  rows=re.findall(r'<a[^>]*href="([^"]*selectBbsNttView[^"]*)"[^>]*>\s*([^<]{5,120})',t)
                  for h,tx in rows[:25]:
                      print("::notice::"+tx.strip()[:90]+" | "+h[:110])
                  if not rows: print("::notice::HTML "+t[:600].replace("\n"," "))
              except Exception as e:
                  print("::notice::ERR "+repr(e)[:300])
          PY
