name: tmp ftc probe
on: workflow_dispatch
jobs:
  t:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install requests
      - name: probe
        run: |
          cat > p.py <<'PYEOF'
          import requests, re, html, traceback
          H={"User-Agent":"Mozilla/5.0"}
          def main():
              found={}
              for kw in ("공시대상기업집단 지정","대규모기업집단 지정"):
                  for pg in range(1,5):
                      r=requests.get("https://www.ftc.go.kr/www/selectBbsNttList.do",params={"key":"12","bordCd":"3","pageIndex":str(pg),"searchCnd":"all","searchKrwd":kw},headers=H,timeout=40)
                      for h,tx in re.findall(r'<a href="(\./selectBbsNttView\.do[^"]*)"[^>]*>(.*?)</a>',r.text,re.S):
                          n=re.search(r"nttSn=(\d+)",h).group(1); t=html.unescape(re.sub(r"<[^>]+>","",tx)).strip()
                          found[n]=t
              print("::notice::전체 "+str(len(found)))
              sel={n:t for n,t in found.items() if re.search(r"지정",t) and re.search(r"기업집단",t) and not re.search(r"제외|설명|제재|행정예고|개정",t)}
              for n,t in sorted(sel.items()):
                  print(f"::notice::{n} | {t[:90]}")
              for n in sorted(sel)[:10]:
                  v=requests.get("https://www.ftc.go.kr/www/selectBbsNttView.do",params={"key":"12","bordCd":"3","nttSn":n},headers=H,timeout=40).text
                  files=re.findall(r'<a[^>]*href="([^"]*downloadBbsFile[^"]*)"[^>]*>(.*?)</a>',v,re.S)
                  print(f"::notice::{n} files={len(files)} "+" || ".join(html.unescape(re.sub(r"<[^>]+>","",tx)).strip()[:36] for h,tx in files)[:700])
          try:
              main()
          except Exception:
              print("::notice::ERR "+traceback.format_exc()[-700:].replace(chr(10)," | "))
          
          PYEOF
          python p.py
