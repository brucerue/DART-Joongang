name: tmp ftc probe
on: workflow_dispatch
jobs:
  t:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install requests
      - name: probe
        run: |
          python - <<'PY'
          import requests, re, html
          H={"User-Agent":"Mozilla/5.0"}
          r=requests.get("https://www.ftc.go.kr/www/selectBbsNttList.do",params={"key":"12","bordCd":"3","pageIndex":"1","searchCnd":"all","searchKrwd":"공시대상기업집단 지정"},headers=H,timeout=40)
          t=r.text
          i=t.find("selectBbsNttView")
          print("::notice::ctx="+repr(t[i-300:i+700])[:1500])
          rows=re.findall(r'<a href="(\./selectBbsNttView\.do[^"]*)"[^>]*>(.*?)</a>',t,re.S)
          for h,tx in rows[:30]:
              m=re.search(r"nttSn=(\d+)",h)
              print("::notice::"+(m.group(1) if m else "?")+" | "+html.unescape(re.sub(r"<[^>]+>","",tx)).strip()[:100])
          PY
