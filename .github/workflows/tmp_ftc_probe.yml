name: tmp ftc probe
on: workflow_dispatch
jobs:
  t:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install requests
      - name: probe
        run: |
          cat > p.py <<'PYEOF'
          import requests, re, html, os, traceback
          H={"User-Agent":"Mozilla/5.0"}
          os.makedirs("out", exist_ok=True)
          def find2025():
              out={}
              for kw in ("25년 공시대상기업집단","2025년 공시대상기업집단","공시대상기업집단 지정 결과 발표","대기업집단 지정"):
                  for pg in range(1,4):
                      r=requests.get("https://www.ftc.go.kr/www/selectBbsNttList.do",params={"key":"12","bordCd":"3","pageIndex":str(pg),"searchCnd":"all","searchKrwd":kw},headers=H,timeout=40)
                      for h,tx in re.findall(r'<a href="(\./selectBbsNttView\.do[^"]*)"[^>]*>(.*?)</a>',r.text,re.S):
                          n=re.search(r"nttSn=(\d+)",h).group(1); out[n]=html.unescape(re.sub(r"<[^>]+>","",tx)).strip()
              return out
          try:
              c=find2025()
              cand={n:t for n,t in c.items() if re.search(r"(25년|2025)",t) and "지정" in t}
              print("::notice::2025후보 "+str(cand)[:600])
              ids=["39722","40410","40748","41119","41476","41915","42416","42836","43406"]+[n for n in cand if n not in ("42836","43406")][:3]
              for n in ids:
                  r=requests.get("https://www.ftc.go.kr/www/downloadBbsFileAll.do",params={"atchmnflNo":n},headers=H,timeout=120)
                  ok=r.status_code==200 and len(r.content)>2000
                  print(f"::notice::{n} status={r.status_code} bytes={len(r.content)} type={r.headers.get('content-type')} cd={r.headers.get('content-disposition')}")
                  if ok: open(f"out/ftc_{n}.zip","wb").write(r.content)
          except Exception:
              print("::notice::ERR "+traceback.format_exc()[-600:].replace(chr(10)," | "))
          
          PYEOF
          python p.py
      - uses: actions/upload-artifact@v4
        with:
          name: ftc
          path: out/
