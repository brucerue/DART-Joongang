name: 장중 시세 모으기

# 평일 장중(한국 시간 09시~15시 30분)에 30분마다 추적 종목의 오늘 5분봉(야후 파이낸스, 비공식)을 'intraday' 브랜치에 저장합니다.
# 앱의 '주가' 탭 시세판·특징주가 '장중' 기준으로 이 파일을 읽습니다.
# GitHub 예약은 몇 분~몇십 분 밀릴 수 있지만, 봉을 통째로 받으므로 시각이 밀려도 괜찮습니다.
on:
  schedule:
    - cron: "5,35 0-6 * * 1-5" # 한국 시간 평일 09:05, 09:35 … 15:35
  workflow_dispatch:

permissions:
  contents: write # intraday 브랜치에 올리기 위해 필요

concurrency:
  group: intraday
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install yfinance
      - name: 추적 종목 목록(KRX 시세 자료) 가져오기
        run: |
          git fetch origin prices --depth=1
          git show origin/prices:prices.json > prices.json
      - name: 오늘 5분봉 받기
        run: python intraday.py --prices prices.json --out intraday.json
      - name: intraday 브랜치에 올리기 (기록을 남기지 않고 한 커밋으로 덮어씀)
        run: |
          mkdir -p out && cp intraday.json out/
          cd out
          git init -q -b intraday
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add intraday.json
          git commit -q -m "intraday $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" intraday
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: 실패 알림
        if: failure()
        run: python news_digest.py --alert intraday
        env:
          PREFS_URL: ${{ secrets.PREFS_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          ADMIN_CHAT_ID: ${{ secrets.ADMIN_CHAT_ID }}
