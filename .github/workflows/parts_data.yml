name: 자동차부품사 전수 자료 모으기

# 상장 자동차부품사(DART 업종코드 303·304 + 직접 추가한 곳)의 10년치 직원 수·평균 근속·급여·매출·영업이익과
# 사업보고서 '주요 제품' 글을 모아 'parts' 브랜치(parts.json, parts.csv, 한 커밋 덮어쓰기)에 저장합니다.
# 기획 취재용으로 손으로 실행합니다. DART 하루 한도에 걸리거나 100분이 지나면 받은 데까지 저장되고, 다시 실행하면 이어받습니다.
# (전체 호출이 8,000번 안팎이라 2~3번 나눠 실행해야 다 받습니다.)
on:
  workflow_dispatch:
    inputs:
      years:
        description: "직원·재무 연도 (예: 2015-2025)"
        default: "2015-2025"
      doc_years:
        description: "사업보고서 원문(주요 제품) 볼 연도 (쉼표)"
        default: "2016,2020,2025"
      extra:
        description: "업종코드가 달라도 넣을 기업 (DART 이름, 쉼표)"
        default: ""
      fresh:
        description: "처음부터 다시 받기 (yes면 지난 자료 무시)"
        default: "no"

permissions:
  contents: write

concurrency:
  group: parts-data
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: 상장사 목록·지난 자료 가져오기
        run: |
          git fetch --depth=1 origin corp-codes
          git show origin/corp-codes:corp_codes.csv > corp_codes.csv
          if [ "$IN_FRESH" != "yes" ] && git fetch --depth=1 origin parts 2>/dev/null; then
            git show origin/parts:parts.json > prev.json || true
          fi
        env:
          IN_FRESH: ${{ inputs.fresh }}
      - name: DART에서 모으기
        run: |
          python parts_data.py --corp-csv corp_codes.csv --out parts.json --csv parts.csv \
            --prev prev.json --years "$IN_YEARS" --doc-years "$IN_DOC_YEARS" --extra "$IN_EXTRA" \
            --max-minutes 100
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
          IN_YEARS: ${{ inputs.years }}
          IN_DOC_YEARS: ${{ inputs.doc_years }}
          IN_EXTRA: ${{ inputs.extra }}
      - name: parts 브랜치에 올리기 (기록은 한 커밋으로 덮어씀, 중간에 멈춰도 받은 데까지)
        if: always() && hashFiles('parts.json') != ''
        run: |
          mkdir -p out && cp parts.json parts.csv out/
          cd out
          git init -q -b parts
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add parts.json parts.csv
          git commit -q -m "parts data $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" parts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
