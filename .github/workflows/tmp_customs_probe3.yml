name: 관세청 품목×국가 조회 시험 (임시)

# 품목별 국가별 수출입실적 API가 어떤 조합(품목 자리수, 국가 지정, 기간, 페이지)을 받는지 확인하는 임시 수동 작업입니다. 확인이 끝나면 지웁니다.
on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: 시험
        env:
          KEY: ${{ secrets.CUSTOMS_API_KEY }}
        run: |
          python - <<'PY' 2>&1 | sed "s/$(printf '%s' "$KEY" | sed 's/[][\.*^$/]/\\&/g')/***KEY***/g" | tee out.txt
          import os, time, urllib.parse, requests
          import xml.etree.ElementTree as ET
          from collections import Counter
          key = os.environ["KEY"].strip()
          if "%" in key: key = urllib.parse.unquote(key)
          URL = "https://apis.data.go.kr/1220000/nitemtrade/getNitemtradeList"
          def call(label, **p):
              t0 = time.time()
              try: r = requests.get(URL, params={"serviceKey": key, **p}, timeout=120)
              except Exception as e: print(f"\n## {label}: 오류 {type(e).__name__}"); return
              try: root = ET.fromstring(r.text)
              except ET.ParseError: print(f"\n## {label}: HTTP {r.status_code} {r.text[:150]!r}"); return
              items = [{c.tag: (c.text or "").strip() for c in it} for it in root.findall(".//item")]
              hdr = {c.tag: (c.text or "").strip() for c in root.find(".//header")} if root.find(".//header") is not None else {}
              body = {c.tag: (c.text or "").strip() for c in root.find(".//body") if c.tag != "items"} if root.find(".//body") is not None else {}
              lens = Counter(len(i.get("hsCd", "")) for i in items)
              months = sorted({i.get("year", "") for i in items})
              print(f"\n## {label}: {hdr.get('resultCode')} {hdr.get('resultMsg')} | item {len(items)} | {len(r.text)//1000}KB {time.time()-t0:.1f}초 | body {body} | hs자리수 {dict(lens)} | 기간값 {months[:3]}..{months[-1:]}")
              for it in items[:2]: print("   ", {k: v[:24] for k, v in it.items()})
          call("HS 2자리(85) 202609", strtYymm="202609", endYymm="202609", hsSgn="85")
          call("HS 4자리(8542)+미국 202609", strtYymm="202609", endYymm="202609", hsSgn="8542", cntyCd="US")
          call("HS 4자리(8542)+미국 12개월", strtYymm="202510", endYymm="202609", hsSgn="8542", cntyCd="US")
          call("국가만(US) 202609", strtYymm="202609", endYymm="202609", cntyCd="US")
          call("국가만(US)+numOfRows=100", strtYymm="202609", endYymm="202609", cntyCd="US", numOfRows="100", pageNo="1")
          call("국가만(US)+numOfRows=100 page2", strtYymm="202609", endYymm="202609", cntyCd="US", numOfRows="100", pageNo="2")
          call("HS 10자리(8542310000)", strtYymm="202609", endYymm="202609", hsSgn="8542310000")
          call("HS 6자리(854231)", strtYymm="202609", endYymm="202609", hsSgn="854231")
          call("HS 2자리(27)+중국 12개월", strtYymm="202510", endYymm="202609", hsSgn="27", cntyCd="CN")
          call("HS 4자리(8703)+전체국가 12개월", strtYymm="202510", endYymm="202609", hsSgn="8703")
          call("없는 HS(9999)", strtYymm="202609", endYymm="202609", hsSgn="9999")
          PY
      - name: 결과를 주석으로 남기기
        if: always()
        run: |
          split -b 2800 -d out.txt part_
          n=0
          for f in part_*; do
            n=$((n+1))
            msg=$(sed ':a;N;$!ba;s/%/%25/g;s/\r/%0D/g;s/\n/%0A/g' "$f")
            echo "::notice title=관세청조합시험 $n::${msg}"
          done
