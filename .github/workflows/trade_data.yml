name: 수출입 통계 모으기

# 매일 한국 시간 아침 8시 30분과 저녁 6시에 관세청 수출입 통계(월별 총괄·국가별·경제권별·시도별·세관별, 10일 단위 잠정치)를
# 'trade' 브랜치에 저장합니다. 앱의 '수출' 탭이 이 파일을 읽습니다. 필요한 Secret: CUSTOMS_API_KEY
# 처음에는 수동 실행(Run workflow)을 한 번 눌러 과거 자료를 채우세요.
on:
  schedule:
    - cron: "30 23 * * *" # 한국 시간 매일 08:30
    - cron: "0 9 * * *"   # 한국 시간 매일 18:00
  workflow_dispatch:

permissions:
  contents: write # trade 브랜치에 올리기 위해 필요

concurrency:
  group: trade-data
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-24.04  # Ubuntu 26 자동 전환을 피하려고 고정 (2026.10)
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: 지금까지 모은 자료 가져오기
        run: |
          git fetch origin trade --depth=1 || true
          git show origin/trade:trade.json > prev.json 2>/dev/null || rm -f prev.json
      - name: 새 달·10일 단위 자료 더하기
        run: |
          python trade_data.py --prev prev.json --out trade.json 2> err.txt | tee summary.txt
          echo "::notice title=수출입 통계::$(cat summary.txt) $(head -c 300 err.txt | tr '\n' ' ')"
        env:
          CUSTOMS_API_KEY: ${{ secrets.CUSTOMS_API_KEY }}
      - name: trade 브랜치에 올리기 (기록을 남기지 않고 한 커밋으로 덮어씀)
        run: |
          mkdir -p out && cp trade.json out/
          cd out
          git init -q -b trade
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add trade.json
          git commit -q -m "trade $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" trade
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: 실패 알림
        if: failure()
        run: python news_digest.py --alert trade
        env:
          PREFS_URL: ${{ secrets.PREFS_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          ADMIN_CHAT_ID: ${{ secrets.ADMIN_CHAT_ID }}
