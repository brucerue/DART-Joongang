name: 임시 외신 검색식 점검
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: pip install -q requests
      - run: |
          python - <<'PY'
          import time, requests, gnews_calc as gc
          from datetime import datetime
          doms = list(gc.GNEWS_OUTLETS.values())
          now = datetime.now(gc.KST)
          def n(core, chunk, days=7, raw=False):
              q = gc.query(core, days, chunk)
              r = requests.get(gc.GNEWS_URL, params={"q": q, "hl": "en-US", "gl": "US", "ceid": "US:en"}, headers={"User-Agent": "Mozilla/5.0"}, timeout=30)
              raw_n = r.text.count("<item>")
              kept = len([i for i in gc.parse_rss(r.content, chunk, days, now) if not gc.GN_JUNK_RE.search(i["title"])])
              time.sleep(1.5)
              return raw_n, kept, len(q)
          korea = "(" + " OR ".join(f'"{w}"' for w in gc.KOREA_WORDS) + ")"
          for sec, words in gc.KOREA_TOPICS.items():
              chunks = gc.domain_chunks(doms)
              cur = [n(gc.korea_core(sec), c) for c in chunks]
              print(f"\n## {sec} 지금 검색식: 받은/남긴/길이 {cur}")
              # 섹터 낱말을 하나씩
              for w in words:
                  core = korea + " " + (f'"{w}"' if " " in w else w) + " " + gc.KOREA_EXCLUDE
                  print(f"   낱말 {w!r}: {[n(core, c)[:2] for c in chunks]}")
              # 북한 제외 없이
              core = korea + " (" + " OR ".join(f'"{w}"' if " " in w else w for w in words) + ")"
              print(f"   북한 제외 없이: {[n(core, c)[:2] for c in chunks]}")
              # 언론사 3곳씩
              print(f"   언론사 3곳씩: {[n(gc.korea_core(sec), tuple(doms[i:i+3]))[:2] for i in range(0, len(doms), 3)]}")
          PY
