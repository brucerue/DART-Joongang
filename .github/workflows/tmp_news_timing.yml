name: 임시 - 뉴스 검색 시간 측정

# 산업 뉴스 '뉴스 조회'가 느린 원인을 재려고 잠깐 두는 작업 (끝나면 지운다). 시간·건수만 출력한다.
on:
  workflow_dispatch:

jobs:
  timing:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: 측정
        env:
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
        run: |
          python - <<'PY'
          import time, requests, xml.etree.ElementTree as ET
          from urllib.parse import urlparse
          from concurrent.futures import ThreadPoolExecutor
          import news_digest as nd
          A = nd.A
          doms = list(A["PUBLISHERS"])
          search, _ = nd.sector_terms("자동차")
          def note(m): print("::notice::" + m, flush=True)
          note(f"자동차 검색어 {len(search)}개, 언론사 {len(doms)}곳")
          def fetch(term, ds, extra):
              q = f'"{term}" {extra} ' + (("(" + " OR ".join(f"site:{d}" for d in ds) + ") ") if ds else "") + "when:1d"
              t = time.time()
              try:
                  r = requests.get("https://news.google.com/rss/search", params={"q": q, "hl": "ko", "gl": "KR", "ceid": "KR:ko"}, headers={"User-Agent": "Mozilla/5.0"}, timeout=30)
                  st = r.status_code; root = ET.fromstring(r.content)
              except Exception as e:
                  return time.time() - t, set(), f"ERR {type(e).__name__}"
              got = set()
              for it in root.iter("item"):
                  src = it.find("source")
                  d = urlparse((src.get("url") if src is not None else "") or "").netloc.lower().removeprefix("www.")
                  if any(d == x or d.endswith("." + x) for x in doms):
                      got.add((it.findtext("title") or "").strip())
              return time.time() - t, got, st
          def run(label, chunk, workers, extra):
              chunks = [doms[i:i + chunk] for i in range(0, len(doms), chunk)] if chunk else [None]
              jobs = [(t, c) for t in search for c in chunks]
              t0 = time.time()
              with ThreadPoolExecutor(workers) as p:
                  res = list(p.map(lambda j: fetch(j[0], j[1], extra), jobs))
              el = time.time() - t0
              titles = set().union(*[r[1] for r in res])
              excl = {x for x in titles if A["is_exclusive"](x)}
              bad = sum(1 for r in res if r[2] != 200)
              each = sorted(r[0] for r in res)
              note(f"{label}: {el:.1f}초, 호출 {len(jobs)}번(실패 {bad}), 한 번 중간값 {each[len(each)//2]:.2f}초, 기사 {len(titles)}건(단독 {len(excl)})")
              return titles
          a = run("단독·지금(8곳씩 5묶음, 동시 6)", 8, 6, "단독")
          b = run("단독·동시 12", 8, 12, "단독")
          c = run("단독·언론사 묶지 않고 1번(동시 6)", None, 6, "단독")
          note(f"   1번 방식이 지금 방식 기사 중 놓친 것: {len(a - c)}건 / 더 찾은 것: {len(c - a)}건")
          d = run("단독·20곳씩 2묶음(동시 6)", 20, 6, "단독")
          note(f"   2묶음 방식이 놓친 것: {len(a - d)}건")
          g = run("일반·지금(8곳씩 5묶음, 동시 6)", 8, 6, "")
          w = run("통신·연합만(동시 6)", None, 6, "")
          t0 = time.time()
          items, _, _ = (None, None, None)
          import os
          if os.environ.get("NAVER_CLIENT_ID"):
              t0 = time.time(); n = nd.naver_search(search, nd.datetime.now(nd.KST) - nd.timedelta(days=1)); note(f"네이버(검색어당 1번): {time.time() - t0:.1f}초, 기사 {len(n)}건")
          PY
