name: 관세청 API 일괄 시험 (임시)

# 승인된 관세청 API들을 한 번씩 호출해 응답 모양을 확인하는 임시 수동 작업입니다. 확인이 끝나면 지웁니다.
# 필요한 것: GitHub Secrets의 CUSTOMS_API_KEY
on:
  workflow_dispatch:
    inputs:
      ym:
        description: 조회 연월 (YYYYMM)
        default: "202509"

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: 시험
        env:
          KEY: ${{ secrets.CUSTOMS_API_KEY }}
          YM: ${{ inputs.ym }}
        run: |
          python - <<'PY' 2>&1 | sed "s/$(printf '%s' "$KEY" | sed 's/[][\.*^$/]/\\&/g')/***KEY***/g" | tee out.txt
          import os, re, urllib.parse, requests
          import xml.etree.ElementTree as ET
          H = {"User-Agent": "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/124 Safari/537.36", "Accept-Language": "ko"}
          key = os.environ["KEY"].strip()
          if "%" in key: key = urllib.parse.unquote(key)
          ym = os.environ["YM"]
          ids = []
          for page in range(1, 6):
              t = requests.get("https://www.data.go.kr/tcs/dss/selectDataSetList.do", params={"dType": "API", "keyword": "관세청", "operator": "AND", "recmSe": "N", "perPage": 40, "currentPage": page, "detailKeyword": ""}, headers=H, timeout=60).text
              f = re.findall(r'/data/(\d{7,8})/openapi\.do', t)
              if not f: break
              ids += [i for i in f if i not in ids]
          apis = []
          for i in ids:
              try: name = requests.get(f"https://www.data.go.kr/catalog/{i}/openapi.json", headers=H, timeout=60).json().get("name", "?")
              except Exception: continue
              if "관세청" not in name: continue
              try: html = requests.get(f"https://www.data.go.kr/data/{i}/openapi.do", headers=H, timeout=60).text
              except Exception: continue
              urls = sorted(set(re.findall(r"https?://apis\.data\.go\.kr/1220000/[A-Za-z0-9_/]+", html)))
              ops = [o for o in sorted(set(re.findall(r"/(get[A-Za-z0-9]+)", html))) if o != "getOrCreateQuickSummary"]
              apis.append((i, name, urls, ops))
          print("API 수", len(apis))
          PARAM_SETS = [{"strtYymm": ym, "endYymm": ym}, {"qryYymmDd": ym + "01", "imexTp": "2"}, {"strtYymm": ym, "endYymm": ym, "imexTp": "1"}, {"baseYymm": ym}, {"searchYymm": ym}]
          def short(el): return {c.tag: (c.text or "").strip()[:28] for c in list(el)[:14]}
          for i, name, urls, ops in apis:
              if not ops: print(f"\n{i} {name}: 함수 이름을 못 찾음"); continue
              op = ops[0]
              svc = op[3:]; svc = svc[:-4] if svc.endswith("List") else svc
              cands = [u for u in urls if u.endswith(op)] or [f"https://apis.data.go.kr/1220000/{x}/{op}" for x in dict.fromkeys([svc[0].lower() + svc[1:], svc, svc.lower()])]
              base = cands[0]
              print(f"\n## {i} {name}")
              done = False
              for base in cands:
                  alive = False
                  for ps in PARAM_SETS[:3]:
                      try: r = requests.get(base, params={"serviceKey": key, **ps}, timeout=60)
                      except Exception as e: print("   오류", type(e).__name__); break
                      try: root = ET.fromstring(r.text)
                      except ET.ParseError: print(f"   HTTP {r.status_code} {r.text[:100]!r}"); continue
                      code, msg = root.findtext(".//resultCode"), root.findtext(".//resultMsg") or root.findtext(".//returnAuthMsg") or root.findtext(".//errMsg")
                      items = root.findall(".//item")
                      if "폐기" in str(msg): break
                      alive = True
                      if code in ("00", "0", None) and items:
                          print(f"   OK {base.split('/1220000/')[1]} 변수 {list(ps)} 건수 {len(items)}")
                          for it in items[:1]: print("     ", short(it))
                          done = True; break
                      print(f"   {base.split('/1220000/')[1]} {list(ps)} -> {code} {str(msg)[:70]}")
                  if done or alive: break
              else:
                  print("   주소를 못 찾음:", [c.split("/1220000/")[1] for c in cands])
          PY
      - name: 결과를 주석으로 남기기
        if: always()
        run: |
          split -b 2800 -d out.txt part_
          n=0
          for f in part_*; do
            n=$((n+1))
            msg=$(sed ':a;N;$!ba;s/%/%25/g;s/\r/%0D/g;s/\n/%0A/g' "$f")
            echo "::notice title=관세청일괄시험 $n::${msg}"
          done
