name: 산업부 보도자료 시험
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests pypdf pyhwp olefile
      - name: 목록·첨부 시험
        run: |
          cat > p.py <<'PY'
          import re, requests
          H = {"User-Agent": "Mozilla/5.0"}
          def note(i, o):
              o = re.sub(r"\s+", " ", o).replace("%", "%25")
              print(f"::notice title=산업부시험{i}::{o}")
          base = "https://www.motie.go.kr"
          import io, time
          notes = []
          def get(u, **kw):
              for k in range(4):
                  try:
                      return requests.get(u, headers=H, timeout=60, **kw)
                  except Exception as e:
                      time.sleep(3 * (k + 1))
              return None
          L = base + "/kor/article/ATCL3f49a5a8c"
          arts = []
          for pg in (4, 7, 16, 21):
              r = get(f"{L}?pageIndex={pg}"); time.sleep(1)
              if r is None: continue
              for tr in re.findall(r"<tr>.*?</tr>", r.text, re.S):
                  if "수출입" in tr and "동향" in tr and "ICT" not in tr and "정보통신" not in tr:
                      m = re.search(r'href="(/kor/article/ATCL3f49a5a8c/\d+/view[^"]*)"', tr)
                      t = re.sub(r"\s+", " ", re.sub(r"<[^>]+>", "", re.search(r'class="ta-l".*?</td>', tr, re.S).group(0))).strip()
                      if m: arts.append((t, m.group(1).replace("&amp;", "&")))
          notes.append("글 %d개: %s" % (len(arts), [a[0][-30:] for a in arts]))
          for t, link in arts[:3]:
              r = get(base + link); time.sleep(1)
              if r is None:
                  notes.append(t[-25:] + " 상세 실패"); continue
              atts = re.findall(r'href="(/attach/down/[^"]+)"[^>]*>(.*?)</a>', r.text, re.S)
              names = [re.sub(r"\s+", " ", re.sub(r"<[^>]+>", "", n)).strip()[:60] for _, n in atts]
              notes.append(f"{t[-25:]} 상세 {r.status_code} 첨부 {len(atts)}개: {names}")
              for (href, _), nm in zip(atts, names):
                  d = get(base + href)
                  if d is None:
                      notes.append("  다운 실패 " + nm); continue
                  info = f"  {nm[:30]} {d.status_code} {len(d.content)}B 머리 {d.content[:4]!r} {d.headers.get('content-disposition','')[:60]}"
                  if d.content[:4] == b"%PDF":
                      from pypdf import PdfReader
                      rd = PdfReader(io.BytesIO(d.content))
                      tx = rd.pages[0].extract_text() or ""
                      info += f" | PDF {len(rd.pages)}쪽 글자 {len(tx)}: {tx[:200]}"
                  elif d.content[:8] == bytes.fromhex("d0cf11e0a1b11ae1"):
                      import olefile
                      ole = olefile.OleFileIO(io.BytesIO(d.content))
                      if ole.exists("PrvText"):
                          info += " | HWP미리보기 " + ole.openstream("PrvText").read().decode("utf-16le", "ignore")[:200]
                  notes.append(info)
          for i, n in enumerate(notes[:9]):
              note(i, n)
          PY
          python p.py
