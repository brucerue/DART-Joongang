name: 산업부 보도자료 시험
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: 목록·첨부 시험
        run: |
          cat > p.py <<'PY'
          import re, requests
          H = {"User-Agent": "Mozilla/5.0"}
          def note(i, o):
              o = re.sub(r"\s+", " ", o).replace("%", "%25")
              print(f"::notice title=산업부시험{i}::{o}")
          base = "https://www.motie.go.kr"
          L = base + "/kor/article/ATCL3f49a5a8c"
          t = requests.get(L + "?pageIndex=2", headers=H, timeout=25).text
          i0 = t.find("수출입")
          note(0, "페이지2 '수출입' 주변: " + t[max(0, i0 - 700):i0 + 500])
          links = re.findall(r"href=\"(/kor/article/ATCL3f49a5a8c/[^\"]+)\"", t)
          note(1, "글 링크 예: %d개 %s" % (len(links), links[:3]))
          note(2, "페이지 번호 링크: " + " ".join(re.findall(r"(?:pageIndex|page)=\d+", t)[:8]))
          PY
          python p.py
