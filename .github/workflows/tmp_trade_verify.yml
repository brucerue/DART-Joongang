name: MTI 주력품목 실제 확인 (임시)

# 앱의 산업부 20대 주력품목 검색이 쓰는 코드(trade_calc.query_mti)를 실제 관세청 응답으로 돌려 보고 보도자료 수치와 비교하는 임시 수동 작업입니다. 확인이 끝나면 지웁니다.
on:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: 확인
        env:
          KEY: ${{ secrets.CUSTOMS_API_KEY }}
        run: |
          python - <<'PY' 2>&1 | sed "s/$(printf '%s' "$KEY" | sed 's/[][\.*^$/]/\\&/g')/***KEY***/g" | tee out.txt
          import os, time, urllib.parse, requests
          import trade_calc as tc
          key = os.environ["KEY"].strip()
          key = urllib.parse.unquote(key) if "%" in key else key
          def fetch(params):
              for a in range(4):
                  try:
                      r = requests.get("https://apis.data.go.kr/1220000/" + tc.ITEM_API_PATH, params={"serviceKey": key, **params}, timeout=(10, 90)); r.raise_for_status(); return r.text
                  except requests.RequestException:
                      time.sleep(1 + a)
              raise tc.TradeApiError("접속 실패")
          mti = tc.load_mti("mti_map.json")
          official = {"반도체": 603.0, "석유제품": 72.2, "일반기계": 40.7, "농수산식품": 11.1, "철강": 22.4, "이차전지": 7.2, "자동차": 60.5, "바이오헬스": 15.0, "섬유": 9.0, "화장품": 15.1}
          for g, off in official.items():
              t0 = time.time()
              rows, sk = tc.query_mti(fetch, mti, "@" + g, None, "202609", "202609")
              t = tc.totals(tc.metrics_by_month(rows))
              print(f"{g}: {t['exp']/1e8:,.1f}억달러 (보도자료 {off}) 행 {len(rows)} {time.time()-t0:.0f}초 건너뜀 {sk}")
          PY
      - name: 결과를 주석으로 남기기
        if: always()
        run: |
          msg=$(sed ':a;N;$!ba;s/%/%25/g;s/\r/%0D/g;s/\n/%0A/g' out.txt | head -c 3500)
          echo "::notice title=주력품목확인::${msg}"
