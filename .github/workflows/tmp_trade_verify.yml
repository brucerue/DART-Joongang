name: 반도체 품목 범위 확인 (임시)

# 반도체 관련 HS 코드들의 수출액을 관세청 10일 단위 1순위 금액과 맞춰 보는 임시 수동 작업입니다. 확인이 끝나면 지웁니다.
on:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: 확인
        env:
          KEY: ${{ secrets.CUSTOMS_API_KEY }}
        run: |
          python - <<'PY' 2>&1 | sed "s/$(printf '%s' "$KEY" | sed 's/[][\.*^$/]/\\&/g')/***KEY***/g" | tee out.txt
          import os, urllib.parse, requests
          import trade_calc as tc
          import xml.etree.ElementTree as ET
          key = os.environ["KEY"].strip()
          key = urllib.parse.unquote(key) if "%" in key else key
          B = "https://apis.data.go.kr/1220000/"
          def fetch(params):
              r = requests.get(B + tc.ITEM_API_PATH, params={"serviceKey": key, **params}, timeout=(10, 90)); r.raise_for_status(); return r.text
          def ten(path, ym):
              r = requests.get(B + path, params={"serviceKey": key, "strtYymm": ym, "endYymm": ym}, timeout=60)
              root = ET.fromstring(r.text)
              for it in root.findall(".//item"):
                  if it.findtext("priodDt") in ("01~30", "01~31"):
                      return int(it.findtext("itemUsdAmt01").replace(",", ""))
          for ym in ("202509", "202609"):
              top = ten("prlstMmUtPrviExpAcrs/getPrlstMmUtPrviExpAcrs", ym)
              print(f"\n===== {ym}  10일 단위 수출 1번째 항목: {top/1e6:.2f}십억달러(={top:,}천달러)")
              acc = {}
              for hs in ("8542", "8541", "8486", "8523", "8473", "8471", "8534", "8532", "9027"):
                  rows = tc.query_items(fetch, hs, None, ym, ym)
                  e = sum(r["exp"] for r in rows)
                  acc[hs] = e
                  print(f"  HS {hs}: 수출 {e/1e6:,.0f}백만달러 (1번째 항목 대비 {e/1000/top*100:.1f}%)")
              for combo in (("8542",), ("8542", "8541"), ("8542", "8541", "8486"), ("8542", "8541", "8523")):
                  s = sum(acc[h] for h in combo)
                  print(f"  합 {'+'.join(combo)} = {s/1e6:,.0f}백만달러 -> 1번째 항목과 차이 {(s/1000-top)/1000:,.0f}백만달러 ({(s/1000/top-1)*100:+.1f}%)")
          PY
      - name: 결과를 주석으로 남기기
        if: always()
        run: |
          msg=$(sed ':a;N;$!ba;s/%/%25/g;s/\r/%0D/g;s/\n/%0A/g' out.txt | head -c 3500)
          echo "::notice title=반도체확인::${msg}"
