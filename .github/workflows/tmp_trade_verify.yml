name: MTI 반도체 범위 확인 (임시)

# 산업부 MTI 반도체(831)에 묶인 HS 10자리 코드들의 수출액을 합쳐 관세청 10일 단위 '반도체' 금액과 맞춰 보는 임시 수동 작업입니다. 확인이 끝나면 지웁니다.
on:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: 확인
        env:
          KEY: ${{ secrets.CUSTOMS_API_KEY }}
        run: |
          python - <<'PY' 2>&1 | sed "s/$(printf '%s' "$KEY" | sed 's/[][\.*^$/]/\\&/g')/***KEY***/g" | tee out.txt
          import os, json, urllib.parse, requests
          from concurrent.futures import ThreadPoolExecutor
          import trade_calc as tc
          import xml.etree.ElementTree as ET
          key = os.environ["KEY"].strip()
          key = urllib.parse.unquote(key) if "%" in key else key
          B = "https://apis.data.go.kr/1220000/"
          def fetch(params):
              r = requests.get(B + tc.ITEM_API_PATH, params={"serviceKey": key, **params}, timeout=(10, 90)); r.raise_for_status(); return r.text
          def ten(path, ym, idx):
              r = requests.get(B + path, params={"serviceKey": key, "strtYymm": ym, "endYymm": ym}, timeout=60)
              for it in ET.fromstring(r.text).findall(".//item"):
                  if it.findtext("priodDt") in ("01~30", "01~31"):
                      return int(it.findtext(f"itemUsdAmt{idx:02d}").replace(",", ""))
          sets = json.load(open("tmp_mti_sets.json", encoding="utf-8"))
          rank = {"반도체": 1, "승용차": 3, "석유제품": 4, "무선통신기기": 5, "선박": 6, "자동차부품": 7}
          def mti_sum(group, ym):
              hsk = set(sets[group]); hs6 = sorted({h[:6] for h in hsk})
              def one(h6):
                  rows = tc.query_items(fetch, h6, None, ym, ym)
                  return sum(r["exp"] for r in rows if r["hs"] in hsk)
              with ThreadPoolExecutor(8) as pool:
                  return sum(pool.map(one, hs6)), len(hsk), len(hs6)
          for ym in ("202509", "202609"):
              print(f"\n===== {ym}")
              for group, label in (("반도체", "반도체"), ("자동차부품", "자동차부품"), ("선박", "선박"), ("석유제품", "석유제품"), ("무선통신기기", "무선통신기기")):
                  top = ten("prlstMmUtPrviExpAcrs/getPrlstMmUtPrviExpAcrs", ym, rank[label])
                  s, n, n6 = mti_sum(group, ym)
                  print(f"  MTI {group}: HSK {n}개/HS6 {n6}개 합계 {s/1000:,.0f}천달러 | 10일단위 '{label}' {top:,}천달러 | 차이 {(s/1000-top):,.0f} ({(s/1000/top-1)*100:+.2f}%)")
          PY
      - name: 결과를 주석으로 남기기
        if: always()
        run: |
          msg=$(sed ':a;N;$!ba;s/%/%25/g;s/\r/%0D/g;s/\n/%0A/g' out.txt | head -c 3500)
          echo "::notice title=MTI확인::${msg}"
