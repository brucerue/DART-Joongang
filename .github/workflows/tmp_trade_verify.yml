name: 수출 검색 실제 응답 확인 (임시)

# 앱의 검색이 쓰는 코드(trade_calc.query_items)를 실제 관세청 응답으로 돌려 보는 임시 수동 작업입니다. 확인이 끝나면 지웁니다.
on:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: 확인
        env:
          KEY: ${{ secrets.CUSTOMS_API_KEY }}
        run: |
          python - <<'PY' 2>&1 | sed "s/$(printf '%s' "$KEY" | sed 's/[][\.*^$/]/\\&/g')/***KEY***/g" | tee out.txt
          import os, urllib.parse, requests
          import trade_calc as tc
          key = os.environ["KEY"].strip()
          key = urllib.parse.unquote(key) if "%" in key else key
          def fetch(params):
              r = requests.get("https://apis.data.go.kr/1220000/" + tc.ITEM_API_PATH, params={"serviceKey": key, **params}, timeout=(10, 90)); r.raise_for_status(); return r.text
          for hs, cn, s, e in (("8542", "US", "202510", "202609"), ("8703", None, "202410", "202609"), ("854231", None, "202609", "202609"), ("27", "CN", "202601", "202609")):
              rows = tc.query_items(fetch, hs, cn, s, e)
              bm = tc.metrics_by_month(rows); t = tc.totals(bm)
              print(f"\n## 품목 {hs} 국가 {cn} {s}~{e}: 행 {len(rows)} 월 {len(bm)}개 ({min(bm)}~{max(bm)})")
              print(f"   합계 수출 {t['exp']/1e8:,.1f}억달러 수입 {t['imp']/1e8:,.1f}억달러 수지 {t['bal']/1e8:,.1f}억달러 수출중량 {t['exp_wgt']/1e6:,.0f}천톤")
              g = tc.group_rows(rows, "cnty")[:3]; h = tc.group_rows(rows, "hs")[:2]
              print("   국가별", [(x["name"], round(x["exp"]/1e8, 1)) for x in g], "| 하위", [(x["code"], x["name"][:12]) for x in h])
          PY
      - name: 결과를 주석으로 남기기
        if: always()
        run: |
          msg=$(sed ':a;N;$!ba;s/%/%25/g;s/\r/%0D/g;s/\n/%0A/g' out.txt | head -c 3000)
          echo "::notice title=검색확인::${msg}"
