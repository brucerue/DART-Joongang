name: 임시 - 판매실적 원문 보기
on: workflow_dispatch
permissions:
  contents: write
jobs:
  t:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: {python-version: "3.12"}
      - run: pip install requests
      - env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
          TELEGRAM_BOT_TOKEN: unused
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir out
          python - <<'PY'
          import news_digest as nd
          for no in ["20250901800660", "20250901800724", "20230103800439", "20230103800494", "20200102800314", "20200102800318", "20230303800057", "20170102800382"]:
              try:
                  t = nd.fetch_doc_text(nd.dart_key(), no)
              except Exception as e:
                  t = f"ERR {e}"
              open(f"out/{no}.txt", "w").write(t)
          PY
          cd out && git init -q -b tmp-sales && git config user.name bot && git config user.email b@b && git add . && git commit -qm d && git push -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" tmp-sales
