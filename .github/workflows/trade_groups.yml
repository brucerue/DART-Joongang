name: 20대 품목 × 국가 모으기

# 산업부 20대 주력 수출품목의 품목 × 국가 × 월별 수출입(최근 10년)을 'groups' 브랜치(groups.json)에 저장합니다.
# 관세청 품목별 국가별 API를 나라마다 받아 HSK-MTI 연계표로 20대 품목에 묶습니다(trade_groups.py).
# 시간이 모자라면 중간에 저장하고 끝나며, 다음 실행이 이어서 합니다(전부 끝나면 complete=true). 매일 한 번 최근 3개월을 다시 받습니다.
# 필요한 Secret: CUSTOMS_API_KEY
on:
  schedule:
    - cron: "40 0 * * *" # 한국 시간 매일 09:40 (08:30 수출입 통계 모으기 뒤)
  workflow_dispatch:
    inputs:
      max_minutes:
        description: "이번 실행에서 쓸 최대 시간(분, 기본 300)"
        default: "300"

permissions:
  contents: write # groups 브랜치에 올리기 위해 필요

concurrency:
  group: groups-data
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-24.04  # Ubuntu 26 자동 전환을 피하려고 고정 (2026.10)
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: 지금까지 모은 자료·국가 목록 가져오기
        run: |
          git fetch origin groups --depth=1 || true
          git show origin/groups:groups.json > prev_groups.json 2>/dev/null || rm -f prev_groups.json
          git fetch origin trade --depth=1
          git show origin/trade:trade.json > trade.json
      - name: 20대 품목 × 국가 받기
        run: |
          python trade_groups.py --trade trade.json --prev prev_groups.json --out groups.json --max-minutes "${{ inputs.max_minutes || '300' }}" > summary.txt 2>&1 || RC=$?
          cat summary.txt
          exit ${RC:-0}
        shell: bash
        env:
          CUSTOMS_API_KEY: ${{ secrets.CUSTOMS_API_KEY }}
      - name: 결과 요약(화면 맨 위 주석)
        if: always()
        run: echo "::notice title=20대 품목::$(tail -c 700 summary.txt 2>/dev/null | tr '\n' ' ' | sed 's/%/%25/g')"
      - name: groups 브랜치에 올리기 (기록을 남기지 않고 한 커밋으로 덮어씀)
        run: |
          mkdir -p out && cp groups.json out/
          cd out
          git init -q -b groups
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add groups.json
          git commit -q -m "groups $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" groups
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: 실패 알림
        if: failure()
        run: python news_digest.py --alert groups
        env:
          PREFS_URL: ${{ secrets.PREFS_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          ADMIN_CHAT_ID: ${{ secrets.ADMIN_CHAT_ID }}
