name: tmp gnews test
on: workflow_dispatch
jobs:
  t:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install requests
      - name: compare
        run: |
          python - <<'PY'
          import requests, xml.etree.ElementTree as ET
          from email.utils import parsedate_to_datetime
          def q(term, sites, days=3):
              s=" OR ".join(f"site:{d}" for d in sites)
              r=requests.get("https://news.google.com/rss/search",params={"q":f'"{term}" ({s}) when:{days}d',"hl":"ko","gl":"KR","ceid":"KR:ko"},headers={"User-Agent":"Mozilla/5.0"},timeout=30)
              root=ET.fromstring(r.content); out=[]
              for it in root.iter("item"):
                  src=it.find("source"); out.append((parsedate_to_datetime(it.findtext("pubDate")).strftime("%m-%d %H:%M"), (src.text if src is not None else ""), (src.get("url") if src is not None else ""), it.findtext("title")[:36]))
              return r.status_code,out
          for term in ("현대차","기아"):
              for sites in (["yna.co.kr"],["yna.co.kr","newsis.com","news1.kr"]):
                  sc,o=q(term,sites); y=[x for x in o if "yna" in x[2]]
                  print(f"::notice::{term} {len(sites)}도메인 status={sc} 전체{len(o)} 연합{len(y)} 최신연합={y[:2]}")
          PY
