name: 임시 받는 사람 설정 점검 (결과는 비공개 저장소에만)
on: workflow_dispatch
jobs:
  c:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: {python-version: "3.12"}
      - run: pip install -q requests
      - uses: actions/cache/restore@v5
        with: {path: digest_prefs.json, key: digest-prefs-x, restore-keys: digest-prefs-}
      - name: 비공개 저장소 받기
        uses: actions/checkout@v5
        with: {repository: brucerue/paper-private, token: "${{ secrets.PAPER_PRIVATE_TOKEN }}", path: private}
      - name: 점검 (화면 출력 없음)
        env:
          PREFS_URL: ${{ secrets.PREFS_URL }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DIGEST_SUBSCRIBERS: ${{ secrets.DIGEST_SUBSCRIBERS }}
        run: |
          python - > /dev/null 2>&1 <<'PY'
          import json, os
          import news_digest as nd
          out = {}
          try:
              base = nd.load_subscribers()
              remote = nd.fetch_remote_prefs()
              prefs = nd.load_prefs()
              if remote:
                  base = nd.merge_approved(base, prefs.get("_approved"))
              subs = nd.apply_prefs(base, prefs, keep_paused=True)
              d = lambda v: v.isoformat() if hasattr(v, "isoformat") else v
              out["remote_ok"] = bool(remote)
              out["subs"] = [{"name": s.get("name"), "base_sectors": next((b.get("sectors") for b in base if b["chat_id"] == s["chat_id"]), None),
                              "raw_pref": {k: v for k, v in (prefs.get(s["chat_id"]) or {}).items() if k not in ("token",)},
                              "applied_sectors": s.get("sectors"), "modes": s.get("modes"), "widened": s.get("widened"),
                              "added": {k: d(v) for k, v in (s.get("added") or {}).items()}, "since": d(s.get("since")),
                              "hours": s.get("hours"), "days": s.get("days"), "paused": s.get("paused")} for s in subs]
              out["pref_keys_without_sub"] = [k for k in prefs if k not in {s["chat_id"] for s in subs} and not k.startswith("_")]
          except Exception as e:
              out["error"] = repr(e)
          os.makedirs("private/debug", exist_ok=True)
          json.dump(out, open("private/debug/prefs_check.json", "w", encoding="utf-8"), ensure_ascii=False, indent=1, default=str)
          PY
          cd private
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add debug/prefs_check.json
          git commit -qm "받는 사람 설정 점검" && git push -q
          echo "저장함"
