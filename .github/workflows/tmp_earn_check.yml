name: 임시 - 잠정실적 원문 읽기 점검

# 알림의 증감률(전년비·전분기비)이 빠지는 원인을 찾으려고 잠깐 두는 작업 (끝나면 지운다). 수치와 표 모양만 출력한다.
on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: 점검
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
        run: |
          python - <<'PY'
          import os, re, news_digest as nd
          from datetime import datetime
          now = datetime.now(nd.KST)
          feed = nd.fetch_dart_feed(now, earn_only=True)
          rows = [r for r in feed if "잠정" in r.get("report_nm", "") and "실적" in r.get("report_nm", "")]
          print(f"::notice::오늘 잠정실적 공시 {len(rows)}건")
          seen = set()
          for r in rows:
              no = r["rcept_no"]
              try:
                  text = nd.fetch_doc_text(nd.dart_key(), no)
              except Exception as e:
                  print(f"::notice::{r['corp_name']} {no}: 원문 아직 없음"); continue
              got = nd.parse_earnings(text) or {}
              rv = got.get("rev") or got.get("op") or {}
              ok = rv.get("prev_y") is not None
              print(f"::notice::{r['corp_name']} {no} 전년동기 {'읽음' if ok else '못 읽음'} | rev={ {k: v for k, v in (got.get('rev') or {}).items()} }")
              if not ok and r["corp_name"] not in seen:
                  seen.add(r["corp_name"])
                  ls = text.splitlines()
                  k = next((i for i, l in enumerate(ls) if "당해" in l), 0)
                  blk = " / ".join(x.strip() for x in ls[max(0, k - 3):k + 40])
                  for j in range(0, min(len(blk), 2700), 900):
                      print(f"::notice::{r['corp_name']} 원문{j // 900 + 1}: {blk[j:j + 900]}")
          PY
